<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Lab Manager — Sign in</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/login.css"></head><body class="login-page"><main class="login-layout"><section class="login-hero"><div><span class="eyebrow">KREA UNIVERSITY MEDIA LAB</span><h1>Equipment for the work you want to make.</h1><p>Access the media lab equipment catalog and lending system.</p></div></section><section class="login-panel"><form id="loginForm" class="login-content"><div class="mark">▱</div><h1>Welcome back</h1><p>Sign in to Media Lab Manager</p><div class="account-types" role="group" aria-label="Account type"><button type="button" class="account-type selected" data-account-type="student">Student</button><button type="button" class="account-type" data-account-type="faculty">Faculty</button><button type="button" class="account-type" data-account-type="media_lab">Media Lab</button></div><input id="accountType" name="accountType" type="hidden" value="student"><label>Krea Email ID<input name="email" type="email" autocomplete="username" placeholder="you@krea.ac.in" required></label><label>4-Digit PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required></label><p id="loginError" class="error" role="alert"></p><button class="primary" type="submit">Login</button><small>Students use @krea.ac.in. Faculty and Media Lab use @krea.edu.in.</small></form></section></main><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
