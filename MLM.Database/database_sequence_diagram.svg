<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2100" viewBox="0 0 1500 2100" role="img" aria-labelledby="title description">
  <title id="title">Media Lab Manager database workflow</title>
  <desc id="description">Sequence diagram showing database initialization, catalog listings, requests, pickup, returns, damage, audit, outbox, and shutdown.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: bold; }
    .participant { fill: #e8eef8; stroke: #4d668f; stroke-width: 2; }
    .participant-text { font-size: 17px; font-weight: bold; text-anchor: middle; }
    .life { stroke: #9aa7ba; stroke-width: 2; stroke-dasharray: 8 8; }
    .section { fill: #315b92; }
    .section-text { fill: white; font-size: 18px; font-weight: bold; }
    .arrow { stroke: #263b5c; stroke-width: 2; marker-end: url(#arrow); }
    .return { stroke: #667085; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    .message { font-size: 15px; }
    .note { fill: #fff8d8; stroke: #c7a936; stroke-width: 1.5; }
    .note-text { font-size: 14px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#263b5c"/>
    </marker>
  </defs>

  <rect width="1500" height="2100" fill="#ffffff"/>
  <text x="750" y="42" class="title" text-anchor="middle">Media Lab Manager - Database Workflow</text>

  <rect x="45" y="70" width="200" height="42" rx="6" class="participant"/><text x="145" y="97" class="participant-text">Backend</text>
  <rect x="330" y="70" width="230" height="42" rx="6" class="participant"/><text x="445" y="97" class="participant-text">Database facade</text>
  <rect x="680" y="70" width="170" height="42" rx="6" class="participant"/><text x="765" y="97" class="participant-text">SQLite</text>
  <rect x="970" y="70" width="180" height="42" rx="6" class="participant"/><text x="1060" y="97" class="participant-text">Audit log</text>
  <rect x="1260" y="70" width="180" height="42" rx="6" class="participant"/><text x="1350" y="97" class="participant-text">Outbox</text>

  <line x1="145" y1="112" x2="145" y2="2040" class="life"/><line x1="445" y1="112" x2="445" y2="2040" class="life"/><line x1="765" y1="112" x2="765" y2="2040" class="life"/><line x1="1060" y1="112" x2="1060" y2="2040" class="life"/><line x1="1350" y1="112" x2="1350" y2="2040" class="life"/>

  <rect x="45" y="145" width="1395" height="34" class="section"/><text x="60" y="168" class="section-text">Database initialization and example data</text>
  <line x1="145" y1="205" x2="445" y2="205" class="arrow"/><text x="165" y="197" class="message">Database(path)</text>
  <line x1="445" y1="240" x2="765" y2="240" class="arrow"/><text x="465" y="232" class="message">Create tables and indexes</text>
  <line x1="445" y1="275" x2="765" y2="275" class="arrow"/><text x="465" y="267" class="message">Migrate listings.images and equipment.listing_id</text>
  <line x1="765" y1="310" x2="445" y2="310" class="return"/><text x="470" y="302" class="message">Database ready</text>
  <line x1="145" y1="345" x2="445" y2="345" class="arrow"/><text x="165" y="337" class="message">Run seed_test_equipment.py</text>
  <line x1="445" y1="380" x2="765" y2="380" class="arrow"/><text x="465" y="372" class="message">Insert users, settings, listings, units, sample requests</text>

  <rect x="45" y="425" width="1395" height="34" class="section"/><text x="60" y="448" class="section-text">Catalog listings and images</text>
  <line x1="145" y1="485" x2="445" y2="485" class="arrow"/><text x="165" y="477" class="message">get_listings(filters)</text>
  <line x1="445" y1="520" x2="765" y2="520" class="arrow"/><text x="465" y="512" class="message">Read listings and linked equipment</text>
  <line x1="765" y1="555" x2="445" y2="555" class="return"/><text x="465" y="547" class="message">Quantity, availability, unit IDs, images JSON</text>
  <line x1="445" y1="590" x2="145" y2="590" class="return"/><text x="165" y="582" class="message">Catalog dictionaries with images list</text>

  <rect x="45" y="635" width="1395" height="34" class="section"/><text x="60" y="658" class="section-text">Request creation</text>
  <line x1="145" y1="695" x2="445" y2="695" class="arrow"/><text x="165" y="687" class="message">create_request(data)</text>
  <line x1="445" y1="730" x2="765" y2="730" class="arrow"/><text x="465" y="722" class="message">Check user and equipment availability</text>
  <line x1="445" y1="765" x2="765" y2="765" class="arrow"/><text x="465" y="757" class="message">Check overlapping time windows</text>
  <line x1="445" y1="800" x2="765" y2="800" class="arrow"/><text x="465" y="792" class="message">Insert request, items, and windows</text>
  <line x1="445" y1="835" x2="765" y2="835" class="arrow"/><text x="465" y="827" class="message">Mark units requested</text>
  <line x1="445" y1="870" x2="1060" y2="870" class="arrow"/><text x="465" y="862" class="message">Record audit</text>
  <line x1="445" y1="905" x2="1350" y2="905" class="arrow"/><text x="465" y="897" class="message">Emit request.created</text>
  <line x1="445" y1="940" x2="145" y2="940" class="return"/><text x="165" y="932" class="message">Request with items and windows</text>

  <rect x="45" y="985" width="1395" height="34" class="section"/><text x="60" y="1008" class="section-text">Approval and pickup</text>
  <line x1="145" y1="1045" x2="445" y2="1045" class="arrow"/><text x="165" y="1037" class="message">approve / reject / cancel</text>
  <line x1="445" y1="1080" x2="765" y2="1080" class="arrow"/><text x="465" y="1072" class="message">Update request and equipment status</text>
  <line x1="445" y1="1115" x2="1060" y2="1115" class="arrow"/><text x="465" y="1107" class="message">Record status audit</text>
  <line x1="445" y1="1150" x2="1350" y2="1150" class="arrow"/><text x="465" y="1142" class="message">Emit request event</text>
  <line x1="145" y1="1190" x2="445" y2="1190" class="arrow"/><text x="165" y="1182" class="message">record_pickup(requestId)</text>
  <line x1="445" y1="1225" x2="765" y2="1225" class="arrow"/><text x="465" y="1217" class="message">Mark return records and units picked_up</text>
  <line x1="445" y1="1260" x2="1060" y2="1260" class="arrow"/><text x="465" y="1252" class="message">Record pickup audit</text>
  <line x1="445" y1="1295" x2="1350" y2="1295" class="arrow"/><text x="465" y="1287" class="message">Emit pickup.confirmed</text>

  <rect x="45" y="1340" width="1395" height="34" class="section"/><text x="60" y="1363" class="section-text">Return and damage</text>
  <line x1="145" y1="1400" x2="445" y2="1400" class="arrow"/><text x="165" y="1392" class="message">record_return(data)</text>
  <line x1="445" y1="1435" x2="765" y2="1435" class="arrow"/><text x="465" y="1427" class="message">Save condition and returned_at</text>
  <line x1="445" y1="1470" x2="765" y2="1470" class="arrow"/><text x="465" y="1462" class="message">Mark each unit available or damaged</text>
  <line x1="445" y1="1505" x2="1060" y2="1505" class="arrow"/><text x="465" y="1497" class="message">Record return audit</text>
  <line x1="445" y1="1540" x2="1350" y2="1540" class="arrow"/><text x="465" y="1532" class="message">Emit return.recorded</text>
  <line x1="145" y1="1580" x2="445" y2="1580" class="arrow"/><text x="165" y="1572" class="message">record_damage(requestItemId, description)</text>
  <line x1="445" y1="1615" x2="765" y2="1615" class="arrow"/><text x="465" y="1607" class="message">Insert report and mark unit damaged</text>
  <line x1="445" y1="1650" x2="1060" y2="1650" class="arrow"/><text x="465" y="1642" class="message">Record damage audit</text>
  <line x1="445" y1="1685" x2="1350" y2="1685" class="arrow"/><text x="465" y="1677" class="message">Emit damage.reported</text>

  <rect x="45" y="1730" width="1395" height="34" class="section"/><text x="60" y="1753" class="section-text">Events and shutdown</text>
  <line x1="145" y1="1790" x2="445" y2="1790" class="arrow"/><text x="165" y="1782" class="message">get_outbox(limit)</text>
  <line x1="445" y1="1825" x2="765" y2="1825" class="arrow"/><text x="465" y="1817" class="message">Read unpublished JSON events</text>
  <line x1="445" y1="1860" x2="145" y2="1860" class="return"/><text x="165" y="1852" class="message">Event list</text>
  <line x1="145" y1="1895" x2="445" y2="1895" class="arrow"/><text x="165" y="1887" class="message">mark_events_published(ids)</text>
  <line x1="445" y1="1930" x2="765" y2="1930" class="arrow"/><text x="465" y="1922" class="message">Set published_at</text>
  <line x1="145" y1="1970" x2="445" y2="1970" class="arrow"/><text x="165" y="1962" class="message">close()</text>
  <line x1="445" y1="2005" x2="765" y2="2005" class="arrow"/><text x="465" y="1997" class="message">Close SQLite connection</text>
</svg>
